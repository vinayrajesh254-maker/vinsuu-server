    justify-content:center;

    <div class="box">
        <h1 id="title">Terms & condition for staff</h1>
        <div id="content" class="content"></div>
    </div>
</div>
<script>
const API = window.location.origin + "/api";

async function load(){
    const res = await fetch(API + "/admin/content/staffTerms");
    const data = await res.json();

    document.getElementById("title").innerText = data.title || "Terms for Staff";
    document.getElementById("content").innerHTML = data.content || "";
}
load();


function goBack(){
    window.history.back();
}
</script>
